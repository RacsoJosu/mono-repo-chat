services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data

  floci-az:
    image: floci/floci-az:latest
    ports:
      - "4577:4577" # Servicios REST: Blob, Queue, Table, Key Vault, etc.
      - "5672:5672" # Event Hubs AMQP
      - "5673:5673" # Service Bus AMQP

volumes:
  datos_postgres:
